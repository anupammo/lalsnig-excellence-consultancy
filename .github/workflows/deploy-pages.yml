name: Deploy to GitHub Pages

# Publishes the static site at the repository root to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that required entry points exist
        run: |
          set -euo pipefail
          for f in index.html 404.html robots.txt sitemap.xml site.webmanifest \
                   assets/css/brand.css assets/css/fonts.css assets/js/site.js \
                   assets/vendor/bootstrap/bootstrap.min.css; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; exit 1; }
          done

      - name: Check every local href/src resolves to a file
        run: |
          set -uo pipefail
          fail=0
          for page in index.html brand.html 404.html; do
            refs=$(grep -oE '(href|src|srcset)="[^"#][^"]*"' "$page" \
              | sed -E 's/^[a-z]+="//; s/"$//' \
              | grep -vE '^(https?:|mailto:|tel:|data:|//)' \
              | sed -E 's#^/lalsnig-excellence-consultancy/##' \
              | grep -vE '^(#|$)' \
              | sort -u)
            for ref in $refs; do
              if [ ! -e "$ref" ]; then
                echo "::error file=$page::broken local reference -> $ref"
                fail=1
              fi
            done
          done
          exit "$fail"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
