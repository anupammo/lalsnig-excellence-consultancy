name: Deploy to GitHub Pages

# Publishes the static site at the repository root to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same script you run locally (node scripts/check-links.mjs), so CI and a
      # developer's machine cannot disagree about what "passing" means. Checks
      # required files, every local reference (including multi-line srcset lists),
      # one h1 per page, no heading skips, canonical on indexable pages,
      # img alt + width/height, and JSON-LD parseability.
      - name: Validate files, references and page structure
        run: node scripts/check-links.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
